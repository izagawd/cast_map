[package]
name = "cast_map"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Castable-key maps over any keyed collection. They store type-erased values, like Box<dyn Any>, and hand out typed CastKeys. The slotmap and gen_map features add backing maps from those crates. It needs a nightly compiler."
keywords = ["slotmap", "cast", "downcast", "allocator", "arena"]
categories = ["data-structures", "memory-management"]
readme = "README.md"

[features]
# Turn this on to use `slotmap::SlotMap` and `slotmap::DenseSlotMap` as backing
# maps.
slotmap = ["dep:slotmap"]
# Turn this on to use `gen_map::GenMap` and `gen_map::DenseGenMap` as backing
# maps.
gen_map = ["dep:gen_map"]
# Turn this on to coerce a `TypeTaggedPtr` to one with an unsized pointee, such
# as a `TypeTaggedBox<Dog>` to a `TypeTaggedBox<dyn Any>`, and to use the
# `insert_sized` and `insert_as` methods.
coerce_unsized = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
slotmap = { version = "1.1", optional = true }
gen_map = { git = "https://github.com/izagawd/gen_map", branch = "master", optional = true }
stable_deref_trait = "1.2.1"

[dev-dependencies]
arrayvec = "0.7"
# The tests keep a `GenMap`'s slots in an `ArrayVec`, which needs `gen_map`'s
# `arrayvec` feature.
gen_map = { git = "https://github.com/izagawd/gen_map", branch = "master", features = ["arrayvec"] }